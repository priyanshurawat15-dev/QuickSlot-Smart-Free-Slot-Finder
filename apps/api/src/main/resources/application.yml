server:
  port: ${PORT:8000}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quickslot}
    username: ${DATABASE_USER:quickslot}
    password: ${DATABASE_PASSWORD:quickslot}
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
quickslot:
  cookie-secure: ${COOKIE_SECURE:true}
  demo-seed: ${DEMO_SEED:false}
