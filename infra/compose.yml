services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: quickslot
      POSTGRES_USER: quickslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U quickslot -d quickslot']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/quickslot
      DATABASE_USER: quickslot
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: production
      DEMO_SEED: 'false'
      COOKIE_SECURE: 'true'

    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  database:

  caddy_data:
  caddy_config:
